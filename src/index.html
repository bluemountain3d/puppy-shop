<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="description" content="">

    <!-- fav-icon -->
     <link rel="shortcut icon" type="image/png" href="img/icons/logo-white.png" >
     <link rel="shortcut icon" type="image/png" sizes="32x32" href="img/icons/logo-white-32x32.png">
     <link rel="shortcut icon" type="image/png" sizes="48x48" href="img/icons/logo-white-48x48.png">
     <link rel="shortcut icon" type="image/png" sizes="128x128" href="img/icons/logo-white-128x128.png">
     <link rel="shortcut icon" type="image/png" sizes="256x256" href="img/icons/logo-white-256x256.png">
     

    <!-- Page Styling -->
    <link rel="stylesheet" href="css/style.min.css">
  </head>
  <body>
    
    <header class="header">
      <a class="header__brand" href="/" aria-label="Puppy Shop logotyp, gå tillbaka till startsidan">
        <img src="img/icons/puppy-shop-logo.svg" alt="Puppy Shop logotype">
      </a>
      <nav header__nav></nav>
      <button class="icon-button icon header__cart-btn js-header-cart-btn" aria-label="Öppna kundvagnen">
        <svg class="icon header__cart-icon" aria-hidden="true">
          <use href="#cart-icon" class="cart-icon"/>
        </svg>
        <span class="header__cart-amount js-cart-amount" aria-hidden="true">000</span>
      </button>
      <button class="header__menu-toggle" aria-label="Öppna/Stänga navigeringmenyn"></button>
    </header>

    <main class="main">

      <div class="products">
        <header class="products__header">
          <h2>Våra valpar!</h2>
        </header>
        <div class="products__wrapper"></div>
      </div>

      <div class="cart hidden">
        <div class="cart__container">
          <div class="cart__wrapper">
            <ul class="cart__content">
              <header class="cart__header">
                <h2 class="cart__heading">Varukorg</h2>
                <div class="cart__counter js-cart-counnter"></span>
                <div class="cart__close js-close-cart">
                  <span class="cart__close-text">Stäng</span>
                  <svg class="icon cart__close-icon">
                    <use href="#close-icon" class="close-icon"/>
                  </svg>
                </div>
              </header>

              <!-- Container for dynamic items -->
              <ul class="cart__items"></ul>

              <!-- Summary container -->
              <div class="cart__summary">
                <div class="cart__summary-row">
                  <p class="cart__summary-label">Delsumma: </p>
                  <span class="cart__subtotal js-summary-subtotal">0 kr</span> 
                </div>
                <div class="cart__summary-row">
                  <p class="cart__summary-label">Rabatter: </p>
                  <span class="cart__value js-summary-discount">0 kr</span>
                </div>
                <div class="cart__summary-row">
                  <p class="cart__summary-label">Moms ingår med: </p>
                  <span class="cart__value js-summary-vat">0 kr</span>
                </div>
                <div class="cart__summary-row">
                  <p class="cart__summary-label">Fraktkostnad: </p>
                  <span class="cart__value js-summary-shipping">0 kr</span>
                </div>
                <div class="cart__summary-row">
                  <p class="cart__summary-label">Summa: </p>
                  <span class="cart__value js-summary-total">0 kr</span>
                </div>
              </div>

              <!-- Continue Button -->
              <button class="cart__continue-btn">
                <span>icon</span><span>Fortsätt med beställningen</span>
              </button>
            

            <div class="checkout__content"></div>

            <div class="order-confirmed__content"></div>

          </div>
        </div>
      </div>
      
    </main>

    <footer class="footer"></footer>
